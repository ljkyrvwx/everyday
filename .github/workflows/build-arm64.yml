name: Build ARM64 Binary

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build ARM64 binary
        env:
          GOPROPY: https://goproxy.cn,direct
        run: |
          cd cmd/yyb-go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../yyb-go-arm64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yyb-go-arm64
          path: yyb-go-arm64
          retention-days: 7
